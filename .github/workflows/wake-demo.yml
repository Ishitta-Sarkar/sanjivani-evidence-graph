name: Wake demo

on:
  schedule:
    # Once a day, so the Streamlit Community Cloud app is less likely
    # to be asleep when someone opens the public URL.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the public app
        run: |
          curl --retry 2 --max-time 120 --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}\n" \
            https://sanjivani-evidence-graph.streamlit.app/
